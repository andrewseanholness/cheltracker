<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chel Tracker | Retro Rink Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        jersey: ['Oswald', 'sans-serif'],
                    },
                    colors: {
                        rink: {
                            ice: '#f5f0e6',
                            surface: '#fdfbf7',
                            border: '#d6cebc',
                            text: '#2c2a26',
                            muted: '#7c776b',
                            red: '#dc2626',
                            blue: '#1d4ed8',
                            black: '#171717',
                            gold: '#ca8a04',
                            silver: '#9ca3af',
                            bronze: '#b45309',
                            platinum: '#0ea5e9',
                            diamond: '#8b5cf6',
                            elite: '#db2777'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f5f0e6;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(220, 38, 38, 0.03) 39px, rgba(220, 38, 38, 0.03) 40px);
            color: #2c2a26;
            background-attachment: fixed;
        }
        .card-shadow { box-shadow: 4px 4px 0px 0px rgba(44, 42, 38, 0.1); }
        .heavy-border { border: 3px solid #2c2a26; }
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f5f0e6; border-left: 2px solid #d6cebc; }
        ::-webkit-scrollbar-thumb { background: #1d4ed8; border-radius: 0; }
        ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
        .stat-number { font-family: 'Oswald', sans-serif; font-weight: 700; }
        .table-row-hover:hover { background-color: #f0ebdf; }
        .stat-bar-bg { background-color: #e5dfd3; height: 10px; width: 100%; border: 1px solid #d6cebc; position: relative; overflow: hidden; }
        .stat-bar-fill { height: 100%; background-color: #1d4ed8; transition: width 1s ease-out; border-right: 2px solid #171717; }
        .stat-bar-fill.red { background-color: #dc2626; }
        .stat-bar-fill.black { background-color: #171717; border-right: none;}
        @keyframes drive { 0% { transform: translateX(-100%); } 100% { transform: translateX(100vw); } }
        .zamboni-container { overflow: hidden; width: 100%; position: relative; }
        .zamboni { animation: drive 3s linear infinite; display: inline-block; }
        .rank-elite { background: linear-gradient(135deg, #171717 0%, #db2777 100%); color: white; border-color: #db2777; }
        .rank-diamond { background: linear-gradient(135deg, #e0e7ff 0%, #8b5cf6 100%); color: white; border-color: #6d28d9; }
        .rank-platinum { background: linear-gradient(135deg, #e0f2fe 0%, #0ea5e9 100%); color: white; border-color: #0369a1; }
        .rank-gold { background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%); color: black; border-color: #854d0e; }
        .rank-silver { background: linear-gradient(135deg, #f3f4f6 0%, #9ca3af 100%); color: black; border-color: #4b5563; }
        .rank-bronze { background: linear-gradient(135deg, #fed7aa 0%, #b45309 100%); color: white; border-color: #78350f; }
        .lg-logo-bg { background-image: repeating-linear-gradient(45deg, #171717 25%, transparent 25%, transparent 75%, #171717 75%, #171717), repeating-linear-gradient(45deg, #171717 25%, #262626 25%, #262626 75%, #171717 75%, #171717); background-position: 0 0, 10px 10px; background-size: 20px 20px; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased selection:bg-rink-red selection:text-white">

    <div class="h-2 w-full bg-rink-red"></div>
    <div class="h-4 w-full bg-rink-blue border-y-2 border-rink-ice"></div>

    <nav class="bg-rink-surface sticky top-0 z-50 heavy-border border-x-0 border-t-0 card-shadow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row items-center justify-between h-auto md:h-24 py-4 md:py-0 gap-4">
                <div class="flex items-center gap-4 cursor-pointer" onclick="switchTab('players')">
                    <div class="w-14 h-14 rounded-full bg-rink-surface heavy-border flex items-center justify-center text-rink-red">
                        <i class="fa-solid fa-hockey-puck text-3xl"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="font-jersey font-bold text-3xl tracking-wide text-rink-black uppercase leading-none">Chel<span class="text-rink-red">Tracker</span></span>
                        <span class="text-xs font-bold tracking-widest text-rink-muted uppercase">Retro Rink Edition</span>
                    </div>
                </div>
                <div class="flex space-x-2 bg-rink-ice p-1.5 heavy-border rounded-sm">
                    <button onclick="switchTab('players')" id="tab-players" class="px-6 py-2 text-sm font-bold uppercase tracking-wider transition-all bg-rink-blue text-white shadow-sm border-2 border-rink-blue">Player Scout</button>
                    <button onclick="switchTab('clubs')" id="tab-clubs" class="px-6 py-2 text-sm font-bold uppercase tracking-wider transition-all text-rink-muted hover:text-rink-black hover:bg-rink-surface border-2 border-transparent">Club Search</button>
                    <button onclick="switchTab('leaderboard')" id="tab-leaderboard" class="px-6 py-2 text-sm font-bold uppercase tracking-wider transition-all text-rink-muted hover:text-rink-black hover:bg-rink-surface border-2 border-transparent">Top 100</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex flex-col gap-10">
        
        <div id="search-section" class="flex flex-col items-center justify-center py-10 text-center space-y-8 bg-rink-surface heavy-border p-8 md:p-16 card-shadow relative overflow-hidden">
            <div class="absolute -top-16 -left-16 w-48 h-48 border-4 border-rink-blue rounded-full opacity-10"></div>
            <div class="absolute -bottom-16 -right-16 w-48 h-48 border-4 border-rink-red rounded-full opacity-10"></div>
            
            <div class="relative z-10">
                <h1 id="search-title" class="text-5xl md:text-7xl font-jersey font-bold text-rink-black uppercase tracking-tight">
                    Scout <span class="text-rink-red">Players</span>
                </h1>
                <p id="search-subtitle" class="text-rink-muted max-w-xl text-lg mt-4 font-medium">Pull live EA Sports NHL Pro Clubs stats.</p>
            </div>
            
            <form onsubmit="handleSearch(event)" class="w-full max-w-2xl mt-8 relative z-10">
                <div class="flex flex-col md:flex-row items-center gap-4">
                    <div class="flex-grow flex items-center bg-white heavy-border p-2 focus-within:border-rink-blue transition-colors w-full">
                        <div class="pl-4 pr-3 text-rink-muted text-xl">
                            <i class="fa-solid fa-search"></i>
                        </div>
                        <input type="text" id="search-input" placeholder="Enter Gamertag..." class="w-full bg-transparent border-none py-3 px-2 text-rink-black focus:outline-none focus:ring-0 placeholder-rink-muted font-bold text-lg uppercase" required>
                    </div>
                    <button type="submit" id="search-btn" class="w-full md:w-auto bg-rink-red text-white font-jersey font-bold text-xl px-10 py-4 uppercase tracking-widest hover:bg-red-700 transition-colors heavy-border whitespace-nowrap card-shadow hover:translate-y-1 hover:shadow-none duration-200">
                        Scout
                    </button>
                </div>
            </form>
        </div>

        <div id="loading-state" class="hidden flex flex-col items-center justify-center py-20 bg-rink-surface heavy-border card-shadow">
            <div class="zamboni-container mb-6">
                <div class="zamboni text-6xl text-rink-blue"><i class="fa-solid fa-truck-pickup"></i></div>
            </div>
            <p class="text-rink-black font-jersey tracking-widest uppercase font-bold text-2xl">Resurfacing the ice...</p>
            <p class="text-rink-muted font-medium mt-2">Fetching EA Server Data</p>
        </div>

        <div id="results-container" class="hidden w-full">
            <!-- Full Profiles Injected Here -->
        </div>

        <div id="leaderboard-container" class="hidden bg-white heavy-border card-shadow relative overflow-hidden">
            <div class="bg-rink-black text-white p-6 border-b-4 border-rink-red flex justify-between items-center">
                <h2 class="font-jersey text-3xl uppercase tracking-widest">Global Top 100</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[800px]">
                    <thead>
                        <tr class="bg-rink-surface border-b-2 border-rink-black text-xs uppercase tracking-widest text-rink-muted font-bold">
                            <th class="p-4 text-center w-20">Rank</th>
                            <th class="p-4">Club Name</th>
                            <th class="p-4 text-center">Div</th>
                            <th class="p-4 text-center">Points</th>
                            <th class="p-4 text-center">Record</th>
                            <th class="p-4 text-center">Trophies</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" class="divide-y divide-rink-border">
                        <!-- Table rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <footer class="border-t-4 border-rink-black mt-auto py-10 bg-rink-surface">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-hockey-puck text-rink-red"></i>
                <span class="font-jersey font-bold text-xl tracking-widest text-rink-black uppercase">ChelTracker</span>
            </div>
            <div class="text-center md:text-right text-rink-muted text-sm font-semibold">
                <p>&copy; 2026 Chel Tracker. Not affiliated with Electronic Arts Inc.</p>
            </div>
        </div>
    </footer>

    <script>
        let currentTab = 'players'; 

        function switchTab(tab) {
            currentTab = tab;
            
            const tabs = ['players', 'clubs', 'leaderboard'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "px-6 py-2 text-sm font-bold uppercase tracking-wider transition-all bg-rink-blue text-white shadow-sm border-2 border-rink-blue";
                } else {
                    btn.className = "px-6 py-2 text-sm font-bold uppercase tracking-wider transition-all text-rink-muted hover:text-rink-black hover:bg-rink-surface border-2 border-transparent";
                }
            });

            const searchSection = document.getElementById('search-section');
            const searchTitle = document.getElementById('search-title');
            const searchInput = document.getElementById('search-input');
            const resultsContainer = document.getElementById('results-container');
            const leaderboardContainer = document.getElementById('leaderboard-container');
            
            resultsContainer.classList.add('hidden');
            leaderboardContainer.classList.add('hidden');
            resultsContainer.innerHTML = '';

            if (tab === 'players') {
                searchSection.classList.remove('hidden');
                searchTitle.innerHTML = `Scout <span class="text-rink-red">Players</span>`;
                searchInput.placeholder = "Enter Gamertag...";
                searchInput.value = '';
            } else if (tab === 'clubs') {
                searchSection.classList.remove('hidden');
                searchTitle.innerHTML = `Find <span class="text-rink-blue">Clubs</span>`;
                searchInput.placeholder = "Enter Club Name...";
                searchInput.value = '';
            } else if (tab === 'leaderboard') {
                searchSection.classList.add('hidden');
                loadLeaderboard();
            }
        }

        async function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('search-input').value;
            const btn = document.getElementById('search-btn');
            const loading = document.getElementById('loading-state');
            const resultsContainer = document.getElementById('results-container');
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            resultsContainer.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                // Ping Vercel Backend
                const response = await fetch(`/api/search?query=${encodeURIComponent(query)}&type=${currentTab}`);
                
                if (!response.ok) throw new Error("Backend failed");
                const rawData = await response.json();

                // Unpack the EA Data (EA often returns arrays or objects with keys)
                let liveData = null;
                if (Array.isArray(rawData) && rawData.length > 0) {
                    liveData = rawData[0]; 
                } else if (rawData && typeof rawData === 'object' && Object.keys(rawData).length > 0 && !rawData.error) {
                    // Sometimes EA returns { "12345": { ...club data } }
                    liveData = Object.values(rawData)[0]; 
                }

                if (!liveData) throw new Error("Data empty");

                renderProfile(liveData);
                
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Scout';

            } catch (error) {
                console.error("Failed:", error);
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Scout';
                resultsContainer.innerHTML = `<div class="bg-rink-surface border-2 border-rink-red p-8 text-center heavy-border"><h2 class="font-jersey text-3xl text-rink-red uppercase mb-2">Scouting Failed</h2><p class="text-rink-black font-bold">Could not locate ${query} or servers are busy.</p></div>`;
                resultsContainer.classList.remove('hidden');
            }
        }

        function renderProfile(data) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            if (currentTab === 'players') {
                // Ensure EA keys safely fallback to 0 or "N/A" if they slightly changed format
                const name = data.name || data.skplayername || data.playerName || 'Unknown Player';
                const gp = data.gamesplayed || data.gamesPlayed || 0;
                const goals = data.skgoals || data.goals || 0;
                const assists = data.skassists || data.assists || 0;
                const wins = data.wins || 0;
                const losses = data.losses || 0;
                const otl = data.otl || 0;
                
                // Extremely simplified UI wrapper to ensure no undefined crashes
                const profileHtml = `
                    <div class="bg-white heavy-border card-shadow w-full flex flex-col lg:flex-row overflow-hidden">
                        <div class="lg:w-1/3 bg-rink-surface border-r-0 lg:border-r-2 border-b-2 lg:border-b-0 border-rink-black p-8 flex flex-col justify-between relative">
                            <div class="flex flex-col items-center justify-center text-center mb-8">
                                <div class="w-32 h-32 rounded-full border-4 border-rink-black overflow-hidden mb-4 bg-gray-200">
                                    <img src="https://media.contentapi.ea.com/content/dam/ea/nhl/nhl-20/common/pro-clubs/avatar.png" class="w-full h-full object-cover">
                                </div>
                                <h2 class="font-jersey font-bold text-4xl text-rink-black uppercase tracking-tight leading-none mb-2">${name}</h2>
                                <span class="bg-rink-blue text-white px-3 py-1 text-xs font-bold uppercase tracking-widest border border-rink-black">${data.favoritePosition || 'Skater'}</span>
                            </div>
                        </div>
                        
                        <div class="lg:w-2/3 p-8 flex flex-col">
                            <h3 class="font-jersey text-2xl uppercase border-b-2 border-rink-red pb-2 inline-block text-rink-black mb-4">Live EA Season Stats</h3>
                            <div class="grid grid-cols-4 gap-4 text-center">
                                <div class="bg-rink-surface border-2 border-rink-border p-4"><div class="text-xs text-rink-muted uppercase font-bold">GP</div><div class="stat-number text-4xl text-rink-black">${gp}</div></div>
                                <div class="bg-rink-surface border-2 border-rink-border p-4"><div class="text-xs text-rink-muted uppercase font-bold">G / W</div><div class="stat-number text-4xl text-rink-red">${goals || wins}</div></div>
                                <div class="bg-rink-surface border-2 border-rink-border p-4"><div class="text-xs text-rink-muted uppercase font-bold">A / L</div><div class="stat-number text-4xl text-rink-blue">${assists || losses}</div></div>
                                <div class="bg-rink-surface border-2 border-rink-border p-4 bg-rink-ice"><div class="text-xs text-rink-muted uppercase font-bold">PTS / OTL</div><div class="stat-number text-4xl text-rink-black">${goals + assists || otl}</div></div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML = profileHtml;

            } else if (currentTab === 'clubs') {
                const name = data.name || data.clubName || 'Unknown Club';
                const wins = data.wins || 0;
                const losses = data.losses || 0;
                const otl = data.otl || data.ties || 0;
                const points = data.rankingPoints || data.points || 0;

                const clubHtml = `
                    <div class="bg-white heavy-border card-shadow w-full p-8 relative overflow-hidden">
                        <div class="relative z-10 flex flex-col lg:flex-row gap-10">
                            <div class="w-full flex flex-col">
                                <div class="flex items-center gap-6 border-b-4 border-rink-black pb-6">
                                    <div class="w-24 h-24 bg-rink-surface border-2 border-rink-black p-2 flex items-center justify-center shadow-inner shrink-0">
                                        <img src="https://media.contentapi.ea.com/content/dam/ea/nhl/nhl-20/common/pro-clubs/t1000.png" class="w-full h-auto">
                                    </div>
                                    <div class="overflow-hidden">
                                        <h2 class="font-jersey font-bold text-5xl text-rink-black uppercase tracking-tight leading-none mb-2 truncate">${name}</h2>
                                        <span class="bg-rink-black text-white px-3 py-1 text-xs font-bold uppercase tracking-widest">Division ${data.division || 1}</span>
                                    </div>
                                </div>
                                <div class="grid grid-cols-3 gap-4 text-center mt-6 mb-6">
                                    <div class="bg-rink-surface border-2 border-rink-border p-4"><div class="text-xs text-rink-muted uppercase font-bold">Wins</div><div class="stat-number text-4xl text-green-600">${wins}</div></div>
                                    <div class="bg-rink-surface border-2 border-rink-border p-4"><div class="text-xs text-rink-muted uppercase font-bold">Losses</div><div class="stat-number text-4xl text-rink-red">${losses}</div></div>
                                    <div class="bg-rink-surface border-2 border-rink-border p-4"><div class="text-xs text-rink-muted uppercase font-bold">OTL</div><div class="stat-number text-4xl text-rink-black">${otl}</div></div>
                                </div>
                                <div class="flex justify-between items-center bg-rink-blue text-white p-6 heavy-border card-shadow">
                                    <span class="font-bold uppercase tracking-widest text-sm">Global Ranking Points</span>
                                    <span class="stat-number text-4xl text-yellow-300 drop-shadow-md">${parseInt(points).toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML = clubHtml;
            }
        }

        async function loadLeaderboard() {
            const container = document.getElementById('leaderboard-container');
            const tbody = document.getElementById('leaderboard-body');
            const loading = document.getElementById('loading-state');
            
            container.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                // Ping Vercel Backend
                const response = await fetch(`/api/search?type=leaderboard`);
                if (!response.ok) throw new Error("Leaderboard API failed");
                const rawData = await response.json();
                
                // Convert to array and slice top 100
                let arr = Array.isArray(rawData) ? rawData : Object.values(rawData);
                arr = arr.slice(0, 100); 

                tbody.innerHTML = '';
                arr.forEach((club, index) => {
                    let rankClass = "bg-rink-surface border-r border-rink-border";
                    if(index === 0) rankClass = "bg-yellow-400 text-rink-black border-r border-rink-black";
                    if(index === 1) rankClass = "bg-gray-300 text-rink-black border-r border-rink-black";
                    if(index === 2) rankClass = "bg-amber-600 text-white border-r border-rink-black";

                    const row = `
                        <tr class="table-row-hover transition-colors group">
                            <td class="p-0 text-center font-jersey font-bold text-2xl ${rankClass}">${index + 1}</td>
                            <td class="p-4">
                                <span class="font-bold text-rink-black text-lg">${club.name || club.clubName || 'Unknown Club'}</span>
                            </td>
                            <td class="p-4 text-center text-rink-muted font-bold text-sm">DIV ${club.division || 1}</td>
                            <td class="p-4 text-center font-jersey font-bold text-2xl text-rink-black">${parseInt(club.rankingPoints || club.points || 0).toLocaleString()}</td>
                            <td class="p-4 text-center text-sm font-bold stat-number">
                                <span class="text-green-600">${club.wins || 0}</span>-<span class="text-rink-red">${club.losses || 0}</span>-<span class="text-rink-muted">${club.otl || club.ties || 0}</span>
                            </td>
                            <td class="p-4 text-center text-rink-black font-bold">
                                <i class="fa-solid fa-trophy mr-1 text-yellow-500 text-sm"></i><span class="stat-number">${club.titlesWon || 0}</span>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
                
                loading.classList.add('hidden');
                container.classList.remove('hidden');
            } catch (e) {
                console.error(e);
                loading.classList.add('hidden');
                container.classList.remove('hidden');
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-rink-red font-bold uppercase">Failed to load Leaderboard. EA Servers may be down.</td></tr>`;
            }
        }
    </script>
</body>
</html>
